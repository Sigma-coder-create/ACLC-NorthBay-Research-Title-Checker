<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password</title>
    <style>

        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', 'Inter', system-ui, -apple-system, sans-serif;
            background: linear-gradient(135deg, #e8edf5 0%, #d5dce8 30%, #c8d3e3 60%, #e2e8f0 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
            position: relative;
            overflow: hidden;
        }

        body::before {
            content: '';
            position: absolute;
            width: 600px;
            height: 600px;
            background: radial-gradient(circle, rgba(99, 120, 155, 0.08) 0%, transparent 70%);
            border-radius: 50%;
            top: -200px;
            right: -150px;
            pointer-events: none;
            z-index: 0;
        }

        body::after {
            content: '';
            position: absolute;
            width: 500px;
            height: 500px;
            background: radial-gradient(circle, rgba(80, 100, 140, 0.06) 0%, transparent 70%);
            border-radius: 50%;
            bottom: -180px;
            left: -120px;
            pointer-events: none;
            z-index: 0;
        }

        /* ── Card ── */
        .login-card {
            position: relative;
            z-index: 1;
            background: #ffffff;
            border-radius: 20px;
            padding: 2.8rem 2.5rem 2.5rem;
            width: 100%;
            max-width: 440px;
            box-shadow:
                0 20px 50px rgba(30, 45, 70, 0.12),
                0 8px 20px rgba(30, 45, 70, 0.06),
                0 0 0 1px rgba(255, 255, 255, 0.5) inset;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .login-card:hover {
            transform: translateY(-2px);
            box-shadow:
                0 28px 60px rgba(30, 45, 70, 0.16),
                0 12px 28px rgba(30, 45, 70, 0.08),
                0 0 0 1px rgba(255, 255, 255, 0.5) inset;
        }

        /* ── Header ── */
        .login-header {
            text-align: center;
            margin-bottom: 2.2rem;
        }

        .welcome-back {
            font-size: 1.85rem;
            font-weight: 700;
            color: #1a1f2e;
            letter-spacing: -0.3px;
            margin-bottom: 0.4rem;
            line-height: 1.2;
        }

        .login-subtitle {
            font-size: 0.95rem;
            color: #6b7280;
            font-weight: 400;
            letter-spacing: 0.1px;
        }

        /* ── Form ── */
        .login-form {
            display: flex;
            flex-direction: column;
            gap: 1.3rem;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 0.4rem;
        }

        .form-group label {
            font-size: 0.875rem;
            font-weight: 600;
            color: #374151;
            letter-spacing: 0.2px;
        }

        .input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        .input-wrapper .icon {
            position: absolute;
            left: 14px;
            pointer-events: none;
            display: flex;
            align-items: center;
        }

        .input-wrapper .icon svg {
            width: 18px;
            height: 18px;
            stroke: #9ca3af;
            fill: none;
            stroke-width: 1.8;
            transition: stroke 0.2s ease;
        }

        .login-form input[type="email"] {
            width: 100%;
            padding: 0.85rem 1rem 0.85rem 2.7rem;
            font-size: 0.95rem;
            border: 1.5px solid #e2e8f0;
            border-radius: 12px;
            background: #f8fafc;
            color: #1f2937;
            outline: none;
            transition: all 0.2s ease;
            font-family: inherit;
            letter-spacing: 0.1px;
        }

        .login-form input:focus {
            border-color: #5b7db5;
            background: #ffffff;
            box-shadow: 0 0 0 4px rgba(91, 125, 181, 0.1);
        }

        .input-wrapper:focus-within .icon svg {
            stroke: #5b7db5;
        }

        .login-form input::placeholder {
            color: #b0b9c6;
            font-size: 0.9rem;
        }

        /* ── Button ── */
        .btn-login {
            width: 100%;
            padding: 0.9rem;
            font-size: 1rem;
            font-weight: 600;
            letter-spacing: 0.3px;
            background: linear-gradient(135deg, #4f6d9e 0%, #3d5680 100%);
            color: #ffffff;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            margin-top: 0.5rem;
            transition: all 0.25s ease;
            box-shadow: 0 4px 14px rgba(61, 86, 128, 0.25);
            font-family: inherit;
            position: relative;
            overflow: hidden;
        }

        .btn-login::after {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.1) 0%, transparent 60%);
            pointer-events: none;
            border-radius: 12px;
        }

        .btn-login:hover {
            background: linear-gradient(135deg, #5a7aad 0%, #476089 100%);
            box-shadow: 0 6px 22px rgba(61, 86, 128, 0.35);
            transform: translateY(-1px);
        }

        .btn-login:active {
            transform: translateY(1px);
            box-shadow: 0 2px 8px rgba(61, 86, 128, 0.2);
            transition: all 0.1s ease;
        }

        /* ── Back to login link ── */
        .back-to-login {
            text-align: center;
            margin-top: 1.6rem;
            font-size: 0.875rem;
            color: #6b7280;
        }

        .back-to-login a {
            color: #5b7db5;
            text-decoration: none;
            font-weight: 600;
            transition: color 0.2s ease;
        }

        .back-to-login a:hover {
            color: #3b5998;
            text-decoration: underline;
            text-underline-offset: 3px;
        }

        /* ── Contact section ── */
        .contact-section {
            text-align: center;
            margin-top: 0.8rem;
            font-size: 0.8rem;
            color: #6b7280;
        }

        .contact-section a {
            color: #5b7db5;
            text-decoration: none;
            font-weight: 500;
        }

        .contact-section a:hover {
            text-decoration: underline;
        }

        /* ── Responsive ── */
        @media (max-width: 480px) {
            .login-card {
                padding: 2rem 1.5rem 1.8rem;
                border-radius: 16px;
            }
            .welcome-back {
                font-size: 1.6rem;
            }
        }
    </style>
</head>
<body>

    <div class="login-card">
        <!-- Header -->
        <div class="login-header">
            <h1 class="welcome-back">Forgot your password?</h1>
            <p class="login-subtitle">Enter your email and we'll send you a reset link</p>
        </div>

        <!-- ⬇️ Put the Thymeleaf message block BELOW the header, BEFORE the form -->
        <div th:if="${message}"
            style="background: #ecfdf5; border: 1px solid #a7f3d0; color: #065f46; 
                    padding: 12px; border-radius: 8px; margin-bottom: 1.2rem; font-size: 0.9rem;">
            <span th:text="${message}"></span>
        </div>

        <!-- Form -->
        <form class="login-form" th:action="@{/forgot-password}" method="post" autocomplete="off">
            <!-- Email -->
            <div class="form-group">
                <label for="email">Email address</label>
                <div class="input-wrapper">
                    <span class="icon">
                        <!-- Mail icon -->
                        <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                            <rect x="2" y="4" width="20" height="16" rx="2" />
                            <path d="M22 4L12 13 2 4" stroke-linecap="round" stroke-linejoin="round" />
                        </svg>
                    </span>
                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Enter your registered email"
                        required
                    >
                </div>
            </div>

            <!-- Submit Button -->
            <button type="submit" class="btn-login">Send Reset Link</button>
        </form>

        <!-- Back to login link -->
        <div class="back-to-login">
            <a th:href="@{/login}" class="login-link">← Back to login</a>
        </div>

        <!-- Contact / Help -->
        <div class="contact-section">
            <span>Need help?</span>
            <a href="mailto:help@info.com">Contact us at help@info.com</a>
        </div>
    </div>

</body>
</html>
