<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Welcome Back</title>
    <style>
        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', 'Inter', system-ui, -apple-system, sans-serif;
            background: linear-gradient(135deg, #e8edf5 0%, #d5dce8 30%, #c8d3e3 60%, #e2e8f0 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
            position: relative;
            overflow: hidden;
        }

        /* ── Subtle background decorative circles ── */
        body::before {
            content: '';
            position: absolute;
            width: 600px;
            height: 600px;
            background: radial-gradient(circle, rgba(99, 120, 155, 0.08) 0%, transparent 70%);
            border-radius: 50%;
            top: -200px;
            right: -150px;
            pointer-events: none;
            z-index: 0;
        }

        body::after {
            content: '';
            position: absolute;
            width: 500px;
            height: 500px;
            background: radial-gradient(circle, rgba(80, 100, 140, 0.06) 0%, transparent 70%);
            border-radius: 50%;
            bottom: -180px;
            left: -120px;
            pointer-events: none;
            z-index: 0;
        }

        /* ── Login Card ── */
        .login-card {
            position: relative;
            z-index: 1;
            background: #ffffff;
            border-radius: 20px;
            padding: 2.8rem 2.5rem 2.5rem;
            width: 100%;
            max-width: 440px;
            box-shadow:
                0 20px 50px rgba(30, 45, 70, 0.12),
                0 8px 20px rgba(30, 45, 70, 0.06),
                0 0 0 1px rgba(255, 255, 255, 0.5) inset;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .login-card:hover {
            transform: translateY(-2px);
            box-shadow:
                0 28px 60px rgba(30, 45, 70, 0.16),
                0 12px 28px rgba(30, 45, 70, 0.08),
                0 0 0 1px rgba(255, 255, 255, 0.5) inset;
        }

        /* ── Header ── */
        .login-header {
            text-align: center;
            margin-bottom: 2.2rem;
        }

        .welcome-back {
            font-size: 1.85rem;
            font-weight: 700;
            color: #1a1f2e;
            letter-spacing: -0.3px;
            margin-bottom: 0.4rem;
            line-height: 1.2;
        }

        .login-subtitle {
            font-size: 0.95rem;
            color: #6b7280;
            font-weight: 400;
            letter-spacing: 0.1px;
        }

        /* ── Form ── */
        .login-form {
            display: flex;
            flex-direction: column;
            gap: 1.3rem;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 0.4rem;
        }

        .form-group label {
            font-size: 0.875rem;
            font-weight: 600;
            color: #374151;
            letter-spacing: 0.2px;
        }

        .input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        .input-wrapper .icon {
            position: absolute;
            left: 14px;
            pointer-events: none;
            display: flex;
            align-items: center;
        }

        .input-wrapper .icon svg {
            width: 18px;
            height: 18px;
            stroke: #9ca3af;
            fill: none;
            stroke-width: 1.8;
            transition: stroke 0.2s ease;
        }

        .form-group input[type="text"],
        .form-group input[type="email"],
        .form-group input[type="password"] {
            width: 100%;
            padding: 0.85rem 1rem 0.85rem 2.7rem;
            font-size: 0.95rem;
            border: 1.5px solid #e2e8f0;
            border-radius: 12px;
            background: #f8fafc;
            color: #1f2937;
            outline: none;
            transition: all 0.2s ease;
            font-family: inherit;
            letter-spacing: 0.1px;
        }

        .form-group input:focus {
            border-color: #5b7db5;
            background: #ffffff;
            box-shadow: 0 0 0 4px rgba(91, 125, 181, 0.1);
        }

        .form-group input:focus~.icon svg,
        .form-group input:focus+.icon svg {
            stroke: #5b7db5;
        }

        /* Adjust icon when input is focused (icon is before input in DOM for username, but after for password? We'll use sibling selector) */
        .input-wrapper:focus-within .icon svg {
            stroke: #5b7db5;
        }

        .form-group input::placeholder {
            color: #b0b9c6;
            font-size: 0.9rem;
        }

        /* ── Password visibility toggle ── */
        .password-toggle {
            position: absolute;
            right: 12px;
            background: none;
            border: none;
            cursor: pointer;
            padding: 6px;
            display: flex;
            align-items: center;
            color: #9ca3af;
            transition: color 0.2s ease;
            z-index: 2;
        }

        .password-toggle:hover {
            color: #4b5563;
        }

        .password-toggle svg {
            width: 20px;
            height: 20px;
        }

        /* ── Remember Me + Forgot Row ── */
        .options-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-top: -0.2rem;
            flex-wrap: wrap;
            gap: 0.5rem;
        }

        .remember-me {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            cursor: pointer;
            user-select: none;
        }

        .remember-me input[type="checkbox"] {
            appearance: none;
            -webkit-appearance: none;
            width: 18px;
            height: 18px;
            border: 1.8px solid #cbd5e1;
            border-radius: 5px;
            background: #f8fafc;
            cursor: pointer;
            position: relative;
            transition: all 0.2s ease;
            flex-shrink: 0;
        }

        .remember-me input[type="checkbox"]:checked {
            background: #5b7db5;
            border-color: #5b7db5;
        }

        .remember-me input[type="checkbox"]:checked::after {
            content: '';
            position: absolute;
            left: 4.5px;
            top: 1.5px;
            width: 5px;
            height: 9px;
            border: solid #ffffff;
            border-width: 0 2px 2px 0;
            transform: rotate(45deg);
        }

        .remember-me span {
            font-size: 0.875rem;
            color: #4b5563;
            font-weight: 500;
        }

        .forgot-password {
            font-size: 0.85rem;
            color: #5b7db5;
            text-decoration: none;
            font-weight: 500;
            transition: color 0.2s ease;
        }

        .forgot-password:hover {
            color: #3b5998;
            text-decoration: underline;
            text-underline-offset: 3px;
        }

        /* ── Login Button ── */
        .btn-login {
            width: 100%;
            padding: 0.9rem;
            font-size: 1rem;
            font-weight: 600;
            letter-spacing: 0.3px;
            background: linear-gradient(135deg, #4f6d9e 0%, #3d5680 100%);
            color: #ffffff;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            margin-top: 0.5rem;
            transition: all 0.25s ease;
            box-shadow: 0 4px 14px rgba(61, 86, 128, 0.25);
            font-family: inherit;
            position: relative;
            overflow: hidden;
        }

        .btn-login::after {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.1) 0%, transparent 60%);
            pointer-events: none;
            border-radius: 12px;
        }

        .btn-login:hover {
            background: linear-gradient(135deg, #5a7aad 0%, #476089 100%);
            box-shadow: 0 6px 22px rgba(61, 86, 128, 0.35);
            transform: translateY(-1px);
        }

        .btn-login:active {
            transform: translateY(1px);
            box-shadow: 0 2px 8px rgba(61, 86, 128, 0.2);
            transition: all 0.1s ease;
        }

        /* ── Contact Link ── */
        .contact-section {
            text-align: center;
            margin-top: 1.6rem;
            font-size: 0.875rem;
            color: #6b7280;
        }

        .contact-section span {
            opacity: 0.85;
        }

        .contact-link {
            color: #5b7db5;
            text-decoration: none;
            font-weight: 600;
            transition: color 0.2s ease;
        }

        .contact-link:hover {
            color: #3b5998;
            text-decoration: underline;
            text-underline-offset: 3px;
        }

        /* ── Responsive ── */
        @media (max-width: 480px) {
            .login-card {
                padding: 2rem 1.5rem 1.8rem;
                border-radius: 16px;
            }

            .welcome-back {
                font-size: 1.6rem;
            }

            .options-row {
                flex-direction: column;
                align-items: flex-start;
                gap: 0.6rem;
            }
        }
    </style>
</head>
<body>

    <div class="login-card">
        <!-- Header -->
        <div class="login-header">
            <h1 class="welcome-back">Welcome back!</h1>
            <p class="login-subtitle">Please sign in to access your account</p>
        </div>
        <div th:if="${error}" style="color: #dc2626; margin-bottom: 1rem; text-align: center;">
            <span th:text="${error}"></span>
        </div>

        <!-- Form -->
        <form class="login-form" th:action="@{/login}" method="post">
            <!-- Username / Email -->
            <div class="form-group">
                <label for="username">Username</label>
                <div class="input-wrapper">
                    <span class="icon">
                        <!-- User icon -->
                        <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                            <circle cx="12" cy="8" r="4" />
                            <path d="M4 20c0-4 4-7 8-7s8 3 8 7" stroke-linecap="round" />
                        </svg>
                    </span>
                    <input
                    type="text"
                    id="username"
                    name="username"
                    placeholder="Enter your username or email"
                    required
                    >
                </div>
            </div>

            <!-- Password -->
            <div class="form-group">
                <label for="password">Password</label>
                <div class="input-wrapper">
                    <span class="icon">
                        <!-- Lock icon -->
                        <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                            <rect x="3" y="11" width="18" height="11" rx="2" />
                            <path d="M7 11V7a5 5 0 0 1 10 0v4" stroke-linecap="round" />
                        </svg>
                    </span>
                    <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Enter your password"
                    required
                    >
                    <button
                    type="button"
                    class="password-toggle"
                    id="togglePassword"
                    aria-label="Toggle password visibility"
                    title="Show/Hide password"
                    >
                    <!-- Eye icon -->
                    <svg id="eyeIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z" />
                        <circle cx="12" cy="12" r="3" />
                    </svg>
                    <!-- Eye-off icon (hidden by default, shown when password is visible) -->
                    <svg id="eyeOffIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none;">
                        <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94" />
                        <path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19" />
                        <line x1="1" y1="1" x2="23" y2="23" />
                    </svg>
                </button>
            </div>
        </div>

        <!-- Remember Me & Forgot Password -->
        <div class="options-row">
            <label class="remember-me">
                <input type="checkbox" name="remember" id="remember">
                <span>Remember Me</span>
            </label>
            <a th:href="@{/forgot}" class="forgot-password">Forgot password?</a>
            
        </div>

        <!-- Submit Button -->
        <button type="submit" class="btn-login">Login</button>
    </form>

    <!-- Contact Link -->
    <div class="contact-section">
        <span>Don't have an account?</span>
        <a th:href="@{/register}" class="contact-link">Create one here</a><br>
        <span>Don't remember your account details?</span>
        <a href="mailto:help@info.com" class="contact-link">Contact us at help@info.com</a>
    </div>
</div>

<!-- Password Toggle Script -->
<script>
    (function() {
        const toggleBtn = document.getElementById('togglePassword');
        const passwordInput = document.getElementById('password');
        const eyeIcon = document.getElementById('eyeIcon');
        const eyeOffIcon = document.getElementById('eyeOffIcon');

        if (toggleBtn && passwordInput && eyeIcon && eyeOffIcon) {
            toggleBtn.addEventListener('click', function() {
                const isPassword = passwordInput.type === 'password';
                // Toggle type
                passwordInput.type = isPassword ? 'text' : 'password';
                // Toggle icons
                if (isPassword) {
                    // Now showing text → show eye-off icon
                    eyeIcon.style.display = 'none';
                    eyeOffIcon.style.display = 'block';
                    toggleBtn.setAttribute('aria-label', 'Hide password');
                } else {
                    // Now showing password → show eye icon
                    eyeIcon.style.display = 'block';
                    eyeOffIcon.style.display = 'none';
                    toggleBtn.setAttribute('aria-label', 'Show password');
                }
            
            });

        }
    })();
</script>

</body>
</html>
