<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - Create Your Account</title>
    <style>
        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', 'Inter', system-ui, -apple-system, sans-serif;
            background: linear-gradient(145deg, #f3f0f8 0%, #e8e2f0 25%, #f0eaf5 50%, #f5f1f9 75%, #ede4f3 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
            position: relative;
            overflow: hidden;
        }

        /* ── Subtle background decorative elements ── */
        body::before {
            content: '';
            position: absolute;
            width: 550px;
            height: 550px;
            background: radial-gradient(circle, rgba(124, 58, 237, 0.10) 0%, rgba(139, 92, 246, 0.04) 40%, transparent 70%);
            border-radius: 50%;
            top: -180px;
            left: -100px;
            pointer-events: none;
            z-index: 0;
        }

        body::after {
            content: '';
            position: absolute;
            width: 480px;
            height: 480px;
            background: radial-gradient(circle, rgba(109, 40, 217, 0.07) 0%, rgba(124, 58, 237, 0.03) 35%, transparent 70%);
            border-radius: 50%;
            bottom: -160px;
            right: -80px;
            pointer-events: none;
            z-index: 0;
        }

        /* ── Floating decorative dots ── */
        .bg-dots {
            position: absolute;
            pointer-events: none;
            z-index: 0;
            opacity: 0.35;
        }
        .bg-dots.top-right {
            top: 60px;
            right: 80px;
            width: 100px;
            height: 100px;
            background: radial-gradient(circle at 20% 30%, rgba(124, 58, 237, 0.5) 2px, transparent 2px),
                radial-gradient(circle at 65% 15%, rgba(139, 92, 246, 0.45) 2.5px, transparent 2.5px),
                radial-gradient(circle at 80% 60%, rgba(124, 58, 237, 0.4) 1.8px, transparent 1.8px),
                radial-gradient(circle at 35% 75%, rgba(167, 139, 250, 0.5) 2px, transparent 2px);
            border-radius: 50%;
        }
        .bg-dots.bottom-left {
            bottom: 50px;
            left: 70px;
            width: 120px;
            height: 120px;
            background: radial-gradient(circle at 30% 20%, rgba(139, 92, 246, 0.45) 2.2px, transparent 2.2px),
                radial-gradient(circle at 70% 40%, rgba(124, 58, 237, 0.5) 1.8px, transparent 1.8px),
                radial-gradient(circle at 15% 65%, rgba(167, 139, 250, 0.4) 2.5px, transparent 2.5px),
                radial-gradient(circle at 55% 80%, rgba(124, 58, 237, 0.5) 2px, transparent 2px);
            border-radius: 50%;
        }

        /* ── Register Card ── */
        .register-card {
            position: relative;
            z-index: 1;
            background: #ffffff;
            border-radius: 24px;
            padding: 3rem 2.5rem 2.5rem;
            width: 100%;
            max-width: 460px;
            box-shadow:
                0 24px 56px rgba(90, 40, 170, 0.10),
                0 10px 24px rgba(90, 40, 170, 0.06),
                0 0 0 1px rgba(255, 255, 255, 0.6) inset;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .register-card:hover {
            transform: translateY(-3px);
            box-shadow:
                0 32px 64px rgba(90, 40, 170, 0.14),
                0 14px 32px rgba(90, 40, 170, 0.08),
                0 0 0 1px rgba(255, 255, 255, 0.6) inset;
        }

        /* ── Card accent stripe ── */
        .register-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 60px;
            height: 4px;
            background: linear-gradient(90deg, #7c3aed, #a78bfa, #7c3aed);
            border-radius: 0 0 6px 6px;
            opacity: 0.8;
        }

        /* ── Header ── */
        .register-header {
            text-align: center;
            margin-bottom: 2.2rem;
        }

        .create-account {
            font-size: 1.85rem;
            font-weight: 700;
            color: #1a1128;
            letter-spacing: -0.3px;
            margin-bottom: 0.4rem;
            line-height: 1.2;
        }

        .register-subtitle {
            font-size: 0.95rem;
            color: #7b6e8a;
            font-weight: 400;
            letter-spacing: 0.1px;
        }

        /* ── Form ── */
        .register-form {
            display: flex;
            flex-direction: column;
            gap: 1.2rem;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 0.4rem;
        }

        .form-group label {
            font-size: 0.875rem;
            font-weight: 600;
            color: #3d3250;
            letter-spacing: 0.2px;
        }

        .input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        .input-wrapper .icon {
            position: absolute;
            left: 14px;
            pointer-events: none;
            display: flex;
            align-items: center;
            z-index: 1;
        }

        .input-wrapper .icon svg {
            width: 18px;
            height: 18px;
            stroke: #b0a5c0;
            fill: none;
            stroke-width: 1.8;
            transition: stroke 0.2s ease;
        }

        .register-form input[type="text"],
        .register-form input[type="email"],
        .register-form input[type="password"] {
            width: 100%;
            padding: 0.85rem 1rem 0.85rem 2.7rem;
            font-size: 0.95rem;
            border: 1.5px solid #e6dfee;
            border-radius: 12px;
            background: #faf8fc;
            color: #2d1f3d;
            outline: none;
            transition: all 0.2s ease;
            font-family: inherit;
            letter-spacing: 0.1px;
        }

        .register-form input:focus {
            border-color: #a78bfa;
            background: #ffffff;
            box-shadow: 0 0 0 4px rgba(139, 92, 246, 0.10);
        }

        .input-wrapper:focus-within .icon svg {
            stroke: #7c3aed;
        }

        .register-form input::placeholder {
            color: #c4b8d6;
            font-size: 0.9rem;
        }

        /* ── Confirm password match states ── */
        #confirmPassword.match-success {
            border-color: #34d399 !important;
            background: #fafdfb !important;
            box-shadow: 0 0 0 4px rgba(52, 211, 153, 0.08) !important;
        }

        #confirmPassword.match-error {
            border-color: #f87171 !important;
            background: #fefafa !important;
            box-shadow: 0 0 0 4px rgba(248, 113, 113, 0.08) !important;
        }

        /* ── Password match message ── */
        .password-match-msg {
            font-size: 0.8rem;
            font-weight: 500;
            min-height: 1.2em;
            transition: color 0.2s ease;
            letter-spacing: 0.1px;
            padding-left: 2px;
        }
        .password-match-msg.match-success {
            color: #059669;
        }
        .password-match-msg.match-error {
            color: #dc2626;
        }

        /* ── Password visibility toggle ── */
        .password-toggle {
            position: absolute;
            right: 12px;
            background: none;
            border: none;
            cursor: pointer;
            padding: 6px;
            display: flex;
            align-items: center;
            color: #b0a5c0;
            transition: color 0.2s ease;
            z-index: 2;
        }

        .password-toggle:hover {
            color: #5b4a6e;
        }

        .password-toggle svg {
            width: 20px;
            height: 20px;
        }

        /* ── Sign Up Button ── */
        .btn-register {
            width: 100%;
            padding: 0.9rem;
            font-size: 1rem;
            font-weight: 600;
            letter-spacing: 0.3px;
            background: linear-gradient(135deg, #7c3aed 0%, #6d28d9 100%);
            color: #ffffff;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            margin-top: 0.3rem;
            transition: all 0.25s ease;
            box-shadow: 0 4px 16px rgba(109, 40, 217, 0.28);
            font-family: inherit;
            position: relative;
            overflow: hidden;
        }

        .btn-register::after {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.12) 0%, transparent 60%);
            pointer-events: none;
            border-radius: 12px;
        }

        .btn-register:hover {
            background: linear-gradient(135deg, #8b5cf6 0%, #7c3aed 100%);
            box-shadow: 0 8px 26px rgba(109, 40, 217, 0.38);
            transform: translateY(-2px);
        }

        .btn-register:active {
            transform: translateY(1px);
            box-shadow: 0 2px 10px rgba(109, 40, 217, 0.22);
            transition: all 0.1s ease;
        }

        /* ── Login Link Section ── */
        .login-link-section {
            text-align: center;
            margin-top: 1.6rem;
            font-size: 0.875rem;
            color: #7b6e8a;
        }

        .login-link-section span {
            opacity: 0.85;
        }

        .login-link {
            color: #7c3aed;
            text-decoration: none;
            font-weight: 600;
            transition: color 0.2s ease;
        }

        .login-link:hover {
            color: #5b21b6;
            text-decoration: underline;
            text-underline-offset: 3px;
        }

        /* ── Help link ── */
        .help-link {
            color: #a78bfa;
            text-decoration: none;
            font-weight: 500;
            transition: color 0.2s ease;
        }

        .help-link:hover {
            color: #7c3aed;
            text-decoration: underline;
            text-underline-offset: 3px;
        }

        /* ── Responsive ── */
        @media (max-width: 480px) {
            .register-card {
                padding: 2.2rem 1.5rem 1.8rem;
                border-radius: 20px;
            }

            .create-account {
                font-size: 1.6rem;
            }

            .register-card::before {
                width: 44px;
                height: 3px;
            }
        }
    </style>
</head>
<body>

    <!-- Decorative background dots -->
    <div class="bg-dots top-right" aria-hidden="true"></div>
    <div class="bg-dots bottom-left" aria-hidden="true"></div>

    <!-- Register Card -->
    <div class="register-card">
        <!-- Header -->
        <div class="register-header">
            <h1 class="create-account">Create your account</h1>
            <p class="register-subtitle">Join us and get started today</p>
        </div>

        <!-- Form -->
        <form class="register-form" th:action="@{/register}" method="post">
            <!-- Username -->
            <div class="form-group">
                <label for="username">Username</label>
                <div class="input-wrapper">
                    <span class="icon">
                        <!-- User icon -->
                        <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                            <circle cx="12" cy="8" r="4" />
                            <path d="M4 20c0-4 4-7 8-7s8 3 8 7" stroke-linecap="round" />
                        </svg>
                    </span>
                    <input
                        type="text"
                        id="username"
                        name="username"
                        placeholder="Choose a username"
                        required
                    >
                </div>
            </div>
            <div class="form-group">
                <label for="email">Email</label>
                <div class="input-wrapper">
                    <span class="icon">
                        <!-- Mail icon (reuse or create a simple SVG) -->
                        <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                            <rect x="2" y="4" width="20" height="16" rx="2" />
                            <path d="M22 4L12 13 2 4" stroke-linecap="round" stroke-linejoin="round" />
                        </svg>
                    </span>
                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Enter your email address"
                        required
                    />
                </div>
            </div>

            <!-- Password -->
            <div class="form-group">
                <label for="password">Password</label>
                <div class="input-wrapper">
                    <span class="icon">
                        <!-- Lock icon -->
                        <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                            <rect x="3" y="11" width="18" height="11" rx="2" />
                            <path d="M7 11V7a5 5 0 0 1 10 0v4" stroke-linecap="round" />
                        </svg>
                    </span>
                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Create a strong password"
                        required
                    >
                    <button
                        type="button"
                        class="password-toggle"
                        id="togglePassword"
                        aria-label="Toggle password visibility"
                        title="Show/Hide password"
                    >
                        <!-- Eye icon -->
                        <svg id="eyeIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z" />
                            <circle cx="12" cy="12" r="3" />
                        </svg>
                        <!-- Eye-off icon -->
                        <svg id="eyeOffIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none;">
                            <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94" />
                            <path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19" />
                            <line x1="1" y1="1" x2="23" y2="23" />
                        </svg>
                    </button>
                </div>
            </div>

            <!-- Confirm Password -->
            <div class="form-group">
                <label for="confirmPassword">Confirm Password</label>
                <div class="input-wrapper">
                    <span class="icon">
                        <!-- Shield-check icon -->
                        <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                            <path d="M12 2l7 4v5c0 5-3.5 9.7-7 11-3.5-1.3-7-6-7-11V6l7-4z" stroke-linecap="round" stroke-linejoin="round" />
                            <path d="M9 12l2 2 4-4" stroke-linecap="round" stroke-linejoin="round" />
                        </svg>
                    </span>
                    <input
                        type="password"
                        id="confirmPassword"
                        name="confirmPassword"
                        placeholder="Re-enter your password"
                        required
                    >
                    <button
                        type="button"
                        class="password-toggle"
                        id="toggleConfirmPassword"
                        aria-label="Toggle confirm password visibility"
                        title="Show/Hide password"
                    >
                        <!-- Eye icon -->
                        <svg id="eyeIconConfirm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z" />
                            <circle cx="12" cy="12" r="3" />
                        </svg>
                        <!-- Eye-off icon -->
                        <svg id="eyeOffIconConfirm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none;">
                            <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94" />
                            <path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19" />
                            <line x1="1" y1="1" x2="23" y2="23" />
                        </svg>
                    </button>
                </div>
                <!-- Password match indicator message -->
                <span class="password-match-msg" id="passwordMatchMsg" aria-live="polite"></span>
            </div>

            <!-- Submit Button -->
            <button type="submit" class="btn-register">Sign Up</button>
        </form>

        <!-- Login Link -->
        <div class="login-link-section">
            <span>Already have an account?</span>
            <a th:href="@{/login}" class="login-link">Sign in here</a><br>
            <span style="font-size:0.8rem;">Need help? </span>
            <a href="mailto:help@info.com" class="help-link">Contact us at help@info.com</a>
        </div>
    </div>

    <!-- Scripts: Password Toggles + Password Match Validation -->
    <script>
        (function() {
            // ── Password visibility toggle (main password) ──
            const toggleBtn = document.getElementById('togglePassword');
            const passwordInput = document.getElementById('password');
            const eyeIcon = document.getElementById('eyeIcon');
            const eyeOffIcon = document.getElementById('eyeOffIcon');

            if (toggleBtn && passwordInput && eyeIcon && eyeOffIcon) {
                toggleBtn.addEventListener('click', function() {
                    const isPassword = passwordInput.type === 'password';
                    passwordInput.type = isPassword ? 'text' : 'password';
                    if (isPassword) {
                        eyeIcon.style.display = 'none';
                        eyeOffIcon.style.display = 'block';
                        toggleBtn.setAttribute('aria-label', 'Hide password');
                    } else {
                        eyeIcon.style.display = 'block';
                        eyeOffIcon.style.display = 'none';
                        toggleBtn.setAttribute('aria-label', 'Show password');
                    }
                });
            }

            // ── Password visibility toggle (confirm password) ──
            const toggleConfirmBtn = document.getElementById('toggleConfirmPassword');
            const confirmPasswordInput = document.getElementById('confirmPassword');
            const eyeIconConfirm = document.getElementById('eyeIconConfirm');
            const eyeOffIconConfirm = document.getElementById('eyeOffIconConfirm');

            if (toggleConfirmBtn && confirmPasswordInput && eyeIconConfirm && eyeOffIconConfirm) {
                toggleConfirmBtn.addEventListener('click', function() {
                    const isPassword = confirmPasswordInput.type === 'password';
                    confirmPasswordInput.type = isPassword ? 'text' : 'password';
                    if (isPassword) {
                        eyeIconConfirm.style.display = 'none';
                        eyeOffIconConfirm.style.display = 'block';
                        toggleConfirmBtn.setAttribute('aria-label', 'Hide password');
                    } else {
                        eyeIconConfirm.style.display = 'block';
                        eyeOffIconConfirm.style.display = 'none';
                        toggleConfirmBtn.setAttribute('aria-label', 'Show password');
                    }
                });
            }

            // ── Real-time password match validation ──
            const passwordField = document.getElementById('password');
            const confirmField = document.getElementById('confirmPassword');
            const matchMsg = document.getElementById('passwordMatchMsg');

            function checkPasswordMatch() {
                const password = passwordField.value;
                const confirm = confirmField.value;

                // Remove existing classes
                confirmField.classList.remove('match-success', 'match-error');
                matchMsg.classList.remove('match-success', 'match-error');

                if (confirm.length === 0) {
                    // Nothing typed yet in confirm field — clear everything
                    matchMsg.textContent = '';
                    return;
                }

                if (password === confirm) {
                    confirmField.classList.add('match-success');
                    matchMsg.classList.add('match-success');
                    matchMsg.textContent = '✓ Passwords match';
                } else {
                    confirmField.classList.add('match-error');
                    matchMsg.classList.add('match-error');
                    matchMsg.textContent = '✗ Passwords do not match';
                }
            }

            if (passwordField && confirmField && matchMsg) {
                passwordField.addEventListener('input', checkPasswordMatch);
                confirmField.addEventListener('input', checkPasswordMatch);
            }
        })();

    </script>

</body>
</html>
