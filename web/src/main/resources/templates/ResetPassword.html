<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password</title>
    <style>
        *, *::before, *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', 'Inter', system-ui, -apple-system, sans-serif;
            background: linear-gradient(145deg, #f3f0f8 0%, #e8e2f0 25%, #f0eaf5 50%, #f5f1f9 75%, #ede4f3 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
            position: relative;
            overflow: hidden;
        }

        body::before {
            content: '';
            position: absolute;
            width: 550px;
            height: 550px;
            background: radial-gradient(circle, rgba(124, 58, 237, 0.10) 0%, rgba(139, 92, 246, 0.04) 40%, transparent 70%);
            border-radius: 50%;
            top: -180px;
            left: -100px;
            pointer-events: none;
            z-index: 0;
        }

        body::after {
            content: '';
            position: absolute;
            width: 480px;
            height: 480px;
            background: radial-gradient(circle, rgba(109, 40, 217, 0.07) 0%, rgba(124, 58, 237, 0.03) 35%, transparent 70%);
            border-radius: 50%;
            bottom: -160px;
            right: -80px;
            pointer-events: none;
            z-index: 0;
        }

        .bg-dots {
            position: absolute;
            pointer-events: none;
            z-index: 0;
            opacity: 0.35;
        }
        .bg-dots.top-right {
            top: 60px;
            right: 80px;
            width: 100px;
            height: 100px;
            background: radial-gradient(circle at 20% 30%, rgba(124, 58, 237, 0.5) 2px, transparent 2px),
                radial-gradient(circle at 65% 15%, rgba(139, 92, 246, 0.45) 2.5px, transparent 2.5px),
                radial-gradient(circle at 80% 60%, rgba(124, 58, 237, 0.4) 1.8px, transparent 1.8px),
                radial-gradient(circle at 35% 75%, rgba(167, 139, 250, 0.5) 2px, transparent 2px);
            border-radius: 50%;
        }
        .bg-dots.bottom-left {
            bottom: 50px;
            left: 70px;
            width: 120px;
            height: 120px;
            background: radial-gradient(circle at 30% 20%, rgba(139, 92, 246, 0.45) 2.2px, transparent 2.2px),
                radial-gradient(circle at 70% 40%, rgba(124, 58, 237, 0.5) 1.8px, transparent 1.8px),
                radial-gradient(circle at 15% 65%, rgba(167, 139, 250, 0.4) 2.5px, transparent 2.5px),
                radial-gradient(circle at 55% 80%, rgba(124, 58, 237, 0.5) 2px, transparent 2px);
            border-radius: 50%;
        }

        .reset-card {
            position: relative;
            z-index: 1;
            background: #ffffff;
            border-radius: 24px;
            padding: 3rem 2.5rem 2.5rem;
            width: 100%;
            max-width: 460px;
            box-shadow:
                0 24px 56px rgba(90, 40, 170, 0.10),
                0 10px 24px rgba(90, 40, 170, 0.06),
                0 0 0 1px rgba(255, 255, 255, 0.6) inset;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .reset-card:hover {
            transform: translateY(-3px);
            box-shadow:
                0 32px 64px rgba(90, 40, 170, 0.14),
                0 14px 32px rgba(90, 40, 170, 0.08),
                0 0 0 1px rgba(255, 255, 255, 0.6) inset;
        }

        .reset-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 60px;
            height: 4px;
            background: linear-gradient(90deg, #7c3aed, #a78bfa, #7c3aed);
            border-radius: 0 0 6px 6px;
            opacity: 0.8;
        }

        .reset-header {
            text-align: center;
            margin-bottom: 2.2rem;
        }

        .reset-title {
            font-size: 1.85rem;
            font-weight: 700;
            color: #1a1128;
            letter-spacing: -0.3px;
            margin-bottom: 0.4rem;
            line-height: 1.2;
        }

        .reset-subtitle {
            font-size: 0.95rem;
            color: #7b6e8a;
            font-weight: 400;
            letter-spacing: 0.1px;
        }

        .reset-form {
            display: flex;
            flex-direction: column;
            gap: 1.2rem;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 0.4rem;
        }

        .form-group label {
            font-size: 0.875rem;
            font-weight: 600;
            color: #3d3250;
            letter-spacing: 0.2px;
        }

        .input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        .input-wrapper .icon {
            position: absolute;
            left: 14px;
            pointer-events: none;
            display: flex;
            align-items: center;
            z-index: 1;
        }

        .input-wrapper .icon svg {
            width: 18px;
            height: 18px;
            stroke: #b0a5c0;
            fill: none;
            stroke-width: 1.8;
            transition: stroke 0.2s ease;
        }

        .reset-form input[type="password"] {
            width: 100%;
            padding: 0.85rem 1rem 0.85rem 2.7rem;
            font-size: 0.95rem;
            border: 1.5px solid #e6dfee;
            border-radius: 12px;
            background: #faf8fc;
            color: #2d1f3d;
            outline: none;
            transition: all 0.2s ease;
            font-family: inherit;
            letter-spacing: 0.1px;
        }

        .reset-form input:focus {
            border-color: #a78bfa;
            background: #ffffff;
            box-shadow: 0 0 0 4px rgba(139, 92, 246, 0.10);
        }

        .input-wrapper:focus-within .icon svg {
            stroke: #7c3aed;
        }

        .reset-form input::placeholder {
            color: #c4b8d6;
            font-size: 0.9rem;
        }

        #confirmPassword.match-success {
            border-color: #34d399 !important;
            background: #fafdfb !important;
            box-shadow: 0 0 0 4px rgba(52, 211, 153, 0.08) !important;
        }

        #confirmPassword.match-error {
            border-color: #f87171 !important;
            background: #fefafa !important;
            box-shadow: 0 0 0 4px rgba(248, 113, 113, 0.08) !important;
        }

        .password-match-msg {
            font-size: 0.8rem;
            font-weight: 500;
            min-height: 1.2em;
            transition: color 0.2s ease;
            letter-spacing: 0.1px;
            padding-left: 2px;
        }
        .password-match-msg.match-success {
            color: #059669;
        }
        .password-match-msg.match-error {
            color: #dc2626;
        }

        .password-toggle {
            position: absolute;
            right: 12px;
            background: none;
            border: none;
            cursor: pointer;
            padding: 6px;
            display: flex;
            align-items: center;
            color: #b0a5c0;
            transition: color 0.2s ease;
            z-index: 2;
        }

        .password-toggle:hover {
            color: #5b4a6e;
        }

        .password-toggle svg {
            width: 20px;
            height: 20px;
        }

        .btn-reset {
            width: 100%;
            padding: 0.9rem;
            font-size: 1rem;
            font-weight: 600;
            letter-spacing: 0.3px;
            background: linear-gradient(135deg, #7c3aed 0%, #6d28d9 100%);
            color: #ffffff;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            margin-top: 0.3rem;
            transition: all 0.25s ease;
            box-shadow: 0 4px 16px rgba(109, 40, 217, 0.28);
            font-family: inherit;
            position: relative;
            overflow: hidden;
        }

        .btn-reset::after {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.12) 0%, transparent 60%);
            pointer-events: none;
            border-radius: 12px;
        }

        .btn-reset:hover {
            background: linear-gradient(135deg, #8b5cf6 0%, #7c3aed 100%);
            box-shadow: 0 8px 26px rgba(109, 40, 217, 0.38);
            transform: translateY(-2px);
        }

        .btn-reset:active {
            transform: translateY(1px);
            box-shadow: 0 2px 10px rgba(109, 40, 217, 0.22);
            transition: all 0.1s ease;
        }

        .link-section {
            text-align: center;
            margin-top: 1.6rem;
            font-size: 0.875rem;
            color: #7b6e8a;
        }

        .link-section a {
            color: #7c3aed;
            text-decoration: none;
            font-weight: 600;
            transition: color 0.2s ease;
        }

        .link-section a:hover {
            color: #5b21b6;
            text-decoration: underline;
            text-underline-offset: 3px;
        }

        .help-link {
            color: #a78bfa;
            text-decoration: none;
            font-weight: 500;
            transition: color 0.2s ease;
        }

        .help-link:hover {
            color: #7c3aed;
            text-decoration: underline;
            text-underline-offset: 3px;
        }

        @media (max-width: 480px) {
            .reset-card {
                padding: 2.2rem 1.5rem 1.8rem;
                border-radius: 20px;
            }
            .reset-title {
                font-size: 1.6rem;
            }
            .reset-card::before {
                width: 44px;
                height: 3px;
            }
        }
    </style>
</head>
<body>

    <div class="bg-dots top-right" aria-hidden="true"></div>
    <div class="bg-dots bottom-left" aria-hidden="true"></div>

    <div class="reset-card">
        <div class="reset-header">
            <h1 class="reset-title">Reset your password</h1>
            <p class="reset-subtitle">Enter your new password below.</p>
        </div>

        <!-- Error message (if token invalid, etc.) -->
        <div th:if="${error}"
             style="background: #fef2f2; border: 1px solid #fecaca; color: #b91c1c;
                    padding: 12px; border-radius: 8px; margin-bottom: 1.2rem; font-size: 0.9rem;">
            <span th:text="${error}"></span>
        </div>

        <form class="reset-form" th:action="@{/reset-password}" method="post">
            <input type="hidden" name="token" th:value="${token}" />

            <!-- New Password -->
            <div class="form-group">
                <label for="password">New Password</label>
                <div class="input-wrapper">
                    <span class="icon">
                        <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                            <rect x="3" y="11" width="18" height="11" rx="2" />
                            <path d="M7 11V7a5 5 0 0 1 10 0v4" stroke-linecap="round" />
                        </svg>
                    </span>
                    <input type="password" id="password" name="password"
                           placeholder="At least 6 characters" required>
                    <button type="button" class="password-toggle" id="togglePassword"
                            aria-label="Toggle password visibility" title="Show/Hide">
                        <svg id="eyeIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                             stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z" />
                            <circle cx="12" cy="12" r="3" />
                        </svg>
                        <svg id="eyeOffIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                             stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                             style="display:none;">
                            <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94" />
                            <path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19" />
                            <line x1="1" y1="1" x2="23" y2="23" />
                        </svg>
                    </button>
                </div>
            </div>

            <!-- Confirm New Password -->
            <div class="form-group">
                <label for="confirmPassword">Confirm New Password</label>
                <div class="input-wrapper">
                    <span class="icon">
                        <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                            <path d="M12 2l7 4v5c0 5-3.5 9.7-7 11-3.5-1.3-7-6-7-11V6l7-4z"
                                  stroke-linecap="round" stroke-linejoin="round" />
                            <path d="M9 12l2 2 4-4" stroke-linecap="round" stroke-linejoin="round" />
                        </svg>
                    </span>
                    <input type="password" id="confirmPassword" name="confirmPassword"
                           placeholder="Re-enter your password" required>
                    <button type="button" class="password-toggle" id="toggleConfirmPassword"
                            aria-label="Toggle confirm password visibility" title="Show/Hide">
                        <svg id="eyeIconConfirm" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                             stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z" />
                            <circle cx="12" cy="12" r="3" />
                        </svg>
                        <svg id="eyeOffIconConfirm" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                             stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                             style="display:none;">
                            <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94" />
                            <path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19" />
                            <line x1="1" y1="1" x2="23" y2="23" />
                        </svg>
                    </button>
                </div>
                <span class="password-match-msg" id="passwordMatchMsg" aria-live="polite"></span>
            </div>

            <button type="submit" class="btn-reset">Reset Password</button>
        </form>

        <div class="link-section">
            <a th:href="@{/login}">← Back to login</a><br>
            <span style="font-size:0.8rem;">Need help? </span>
            <a href="mailto:help@info.com" class="help-link">Contact us at help@info.com</a>
        </div>
    </div>

    <script>
        (function() {
            const toggleBtn = document.getElementById('togglePassword');
            const passwordInput = document.getElementById('password');
            const eyeIcon = document.getElementById('eyeIcon');
            const eyeOffIcon = document.getElementById('eyeOffIcon');

            if (toggleBtn && passwordInput && eyeIcon && eyeOffIcon) {
                toggleBtn.addEventListener('click', function() {
                    const isPassword = passwordInput.type === 'password';
                    passwordInput.type = isPassword ? 'text' : 'password';
                    eyeIcon.style.display = isPassword ? 'none' : 'block';
                    eyeOffIcon.style.display = isPassword ? 'block' : 'none';
                });
            }

            const toggleConfirmBtn = document.getElementById('toggleConfirmPassword');
            const confirmInput = document.getElementById('confirmPassword');
            const eyeIconConfirm = document.getElementById('eyeIconConfirm');
            const eyeOffIconConfirm = document.getElementById('eyeOffIconConfirm');

            if (toggleConfirmBtn && confirmInput && eyeIconConfirm && eyeOffIconConfirm) {
                toggleConfirmBtn.addEventListener('click', function() {
                    const isPassword = confirmInput.type === 'password';
                    confirmInput.type = isPassword ? 'text' : 'password';
                    eyeIconConfirm.style.display = isPassword ? 'none' : 'block';
                    eyeOffIconConfirm.style.display = isPassword ? 'block' : 'none';
                });
            }

            const passwordField = document.getElementById('password');
            const confirmField = document.getElementById('confirmPassword');
            const matchMsg = document.getElementById('passwordMatchMsg');

            function checkPasswordMatch() {
                const password = passwordField.value;
                const confirm = confirmField.value;
                confirmField.classList.remove('match-success', 'match-error');
                matchMsg.classList.remove('match-success', 'match-error');
                if (confirm.length === 0) {
                    matchMsg.textContent = '';
                    return;
                }
                if (password === confirm) {
                    confirmField.classList.add('match-success');
                    matchMsg.classList.add('match-success');
                    matchMsg.textContent = '✓ Passwords match';
                } else {
                    confirmField.classList.add('match-error');
                    matchMsg.classList.add('match-error');
                    matchMsg.textContent = '✗ Passwords do not match';
                }
            }

            if (passwordField && confirmField && matchMsg) {
                passwordField.addEventListener('input', checkPasswordMatch);
                confirmField.addEventListener('input', checkPasswordMatch);
            }
        })();
    </script>
</body>
</html>
